config-version = 2
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 24
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

[key-mapping]
  preset = 'qwerty'

[gaps]
  inner.horizontal = 8
  inner.vertical = 8
  outer.left = 8
  outer.bottom = 8
  outer.top = 8
  outer.right = 8

[mode.main.binding]
  alt-enter = 'exec-and-forget open -na Ghostty'

  alt-slash = 'layout tiles horizontal vertical'
  alt-comma = 'layout accordion horizontal vertical'
  alt-shift-space = 'layout floating tiling'
  alt-f = 'fullscreen'

  alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
  alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
  alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
  alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

  alt-ctrl-h = 'focus-monitor --wrap-around left'
  alt-ctrl-j = 'focus-monitor --wrap-around down'
  alt-ctrl-k = 'focus-monitor --wrap-around up'
  alt-ctrl-l = 'focus-monitor --wrap-around right'

  alt-shift-h = 'move left'
  alt-shift-j = 'move down'
  alt-shift-k = 'move up'
  alt-shift-l = 'move right'

  alt-shift-ctrl-h = 'move-node-to-monitor --focus-follows-window --wrap-around left'
  alt-shift-ctrl-j = 'move-node-to-monitor --focus-follows-window --wrap-around down'
  alt-shift-ctrl-k = 'move-node-to-monitor --focus-follows-window --wrap-around up'
  alt-shift-ctrl-l = 'move-node-to-monitor --focus-follows-window --wrap-around right'

  alt-minus = 'resize smart -50'
  alt-equal = 'resize smart +50'

  alt-1 = 'workspace 1'
  alt-2 = 'workspace 2'
  alt-3 = 'workspace 3'
  alt-4 = 'workspace 4'
  alt-5 = 'workspace 5'
  alt-6 = 'workspace 6'
  alt-7 = 'workspace 7'
  alt-8 = 'workspace 8'
  alt-9 = 'workspace 9'

  alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
  alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
  alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
  alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
  alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
  alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
  alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
  alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
  alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

  alt-tab = 'workspace-back-and-forth'
  alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

  alt-r = 'mode resize'
  alt-shift-semicolon = 'mode service'
  alt-shift-c = 'reload-config'

[mode.resize.binding]
  h = 'resize width -40'
  j = 'resize height +40'
  k = 'resize height -40'
  l = 'resize width +40'
  minus = 'resize smart -50'
  equal = 'resize smart +50'
  enter = 'mode main'
  esc = 'mode main'

[mode.service.binding]
  esc = ['reload-config', 'mode main']
  r = ['flatten-workspace-tree', 'balance-sizes', 'mode main']
  f = ['layout floating tiling', 'mode main']
  b = ['balance-sizes', 'mode main']
  backspace = ['close-all-windows-but-current', 'mode main']

  alt-shift-h = ['join-with left', 'mode main']
  alt-shift-j = ['join-with down', 'mode main']
  alt-shift-k = ['join-with up', 'mode main']
  alt-shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
  if.app-id = 'com.apple.finder'
  run = 'layout floating'

[[on-window-detected]]
  if.app-id = 'com.apple.systempreferences'
  run = 'layout floating'

[[on-window-detected]]
  if.app-id = 'com.apple.ActivityMonitor'
  run = 'layout floating'
